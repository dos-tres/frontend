name: Frontend build
on:
  push:
    branches: [main, feat/v1, feat/home-design]
  pull_request:
    branches: [main, feat/v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
