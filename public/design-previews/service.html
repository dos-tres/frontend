<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>둘셋 · 실서비스 스타일 미리보기</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#26332f;background:#fff}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#f7f8f9;border-bottom:1px solid #dde2e6;font-size:13px}.toolbar span{flex:1}.toolbar button{font:inherit;padding:8px 13px;border:1px solid #c9d0d7;border-radius:7px;background:#fff;cursor:pointer}iframe{display:block;width:100%;height:calc(100dvh - 64px);min-height:600px;border:0}</style></head><body><div class="toolbar"><strong>스타일 미리보기</strong><span>기존 화면에 선택한 CSS만 적용 · 앱 원본 미변경</span><button id="toggle" aria-pressed="true">원래 스타일 보기</button><button id="home">홈으로</button></div><iframe id="preview" src="/" title="둘셋 스타일 비교" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe><script>
const frame=document.getElementById('preview');const toggle=document.getElementById('toggle');let enabled=true;
function apply(){const doc=frame.contentDocument;if(!doc)return;let link=doc.getElementById('service-preview-style');if(!link){link=doc.createElement('link');link.id='service-preview-style';link.rel='stylesheet';link.href='/src/service-style.css';doc.head.appendChild(link);}link.disabled=!enabled;toggle.textContent=enabled?'원래 스타일 보기':'실서비스 스타일 보기';toggle.setAttribute('aria-pressed',String(enabled));}
frame.addEventListener('load',apply);toggle.addEventListener('click',()=>{enabled=!enabled;apply()});document.getElementById('home').addEventListener('click',()=>{frame.src='/'});
</script></body></html>
